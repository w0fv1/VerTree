name: vertree
description: "针对单文件的版本管理系统"
publish_to: 'none'

version: 2.0.0

environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  uuid: ^4.5.1
  bitsdojo_window: ^0.1.6
  flutter_background_service: ^5.1.0
  nativeapi: ^0.1.0
  tray_manager: ^0.5.2
  win32_registry: ^2.1.0
  window_manager: ^0.5.1
  superuser: ^3.0.0+1
  ffi: ^2.1.4
  win32: ^5.11.0
  windows_single_instance: ^1.0.1
  path_provider: ^2.1.5
  loading_indicator: ^3.1.1
  local_notifier: ^0.1.6
  launch_at_startup: ^0.5.1
  file_picker: ^10.3.10
  url_launcher: ^6.3.1
  toastification: ^3.0.1
  intl: ^0.20.2
  http: ^1.3.0
  path: ^1.9.1
  mime: ^2.0.0
  flutter_vector_icons: ^2.0.0
  qr_flutter: ^4.1.0
  package_info_plus: ^9.0.1
  flutter_inappwebview: ^6.1.5
  crypto: ^3.0.7
  diff_match_patch: ^0.4.1

dev_dependencies:
  analyzer: ^10.0.1
  flutter_test:
    sdk: flutter
  test: ^1.26.3
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/img/logo/
    - assets/img/icon/
    - assets/office_viewer/
    - assets/office_viewer/assets/
